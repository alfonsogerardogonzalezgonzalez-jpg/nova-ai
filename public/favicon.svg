<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient: Deep Dark Cosmic Blue -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080E1F" />
      <stop offset="50%" stop-color="#060B18" />
      <stop offset="100%" stop-color="#040711" />
    </linearGradient>

    <!-- Ambient Core Glow -->
    <radialGradient id="ambientGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.28" />
      <stop offset="50%" stop-color="#8B5CF6" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#060B18" stop-opacity="0" />
    </radialGradient>

    <!-- Electric Blue Gradient (Left Stem) -->
    <linearGradient id="electricBlue" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1D4ED8" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#00D2FF" />
    </linearGradient>

    <!-- Dynamic Diagonal Ribbon (Cyan -> Indigo -> Violet) -->
    <linearGradient id="diagonalRibbon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="25%" stop-color="#3B82F6" />
      <stop offset="65%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>

    <!-- Electric Violet Gradient (Right Stem) -->
    <linearGradient id="electricViolet" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6D28D9" />
      <stop offset="50%" stop-color="#9333EA" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>

    <!-- Subtle Specular Highlights -->
    <linearGradient id="specularHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <!-- Drop Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur1" />
      <feGaussianBlur stdDeviation="24" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Deep Dark Blue Canvas Background -->
  <rect width="512" height="512" fill="url(#bgGrad)" />
  <circle cx="256" cy="256" r="230" fill="url(#ambientGlow)" />
  
  <!-- Subtle Outer Precision Border (for App Icon) -->
  <rect x="2" y="2" width="508" height="508" rx="112" fill="none" stroke="#1E293B" stroke-width="2" stroke-opacity="0.3" />

  <!-- Stylized Geometric 'N' Glyph -->
  <g transform="translate(40.96000000000001, 40.96000000000001) scale(0.84)" filter="url(#neonGlow)">
    
    <!-- LEFT PILLAR (Electric Blue) -->
    <!-- Sleek beveled vertical column -->
    <path
      d="M 126 390 
         L 126 142 
         C 126 124, 140 110, 158 110 
         L 178 110 
         C 196 110, 210 124, 210 142 
         L 210 390 
         C 210 408, 196 422, 178 422 
         L 158 422 
         C 140 422, 126 408, 126 390 Z"
      fill="url(#electricBlue)"
    />
    <!-- Left Pillar Specular Spine -->
    <path
      d="M 142 142 L 142 390"
      stroke="#60A5FA"
      stroke-width="3"
      stroke-linecap="round"
      opacity="0.5"
    />

    <!-- RIGHT PILLAR (Electric Violet) -->
    <!-- Harmonized vertical column on right -->
    <path
      d="M 302 370 
         L 302 122 
         C 302 104, 316 90, 334 90 
         L 354 90 
         C 372 90, 386 104, 386 122 
         L 386 370 
         C 386 388, 372 402, 354 402 
         L 334 402 
         C 316 402, 302 388, 302 370 Z"
      fill="url(#electricViolet)"
    />
    <!-- Right Pillar Specular Spine -->
    <path
      d="M 370 122 L 370 370"
      stroke="#E879F9"
      stroke-width="3"
      stroke-linecap="round"
      opacity="0.5"
    />

    <!-- DYNAMIC CROSS DIAGONAL (Electric Blue to Electric Violet) -->
    <!-- Sleek aerodynamic diagonal bridge cutting from top left to bottom right -->
    <path
      d="M 142 114 
         C 160 114, 186 124, 204 146 
         L 350 364 
         C 362 380, 370 392, 386 400 
         C 370 410, 342 410, 324 394 
         L 168 166 
         C 152 144, 144 130, 142 114 Z"
      fill="url(#diagonalRibbon)"
    />

    <!-- Intersection Accent Gem / High-Tech Vertex Node -->
    <circle cx="176" cy="148" r="8" fill="#38BDF8" opacity="0.9" />
    <circle cx="340" cy="368" r="8" fill="#C084FC" opacity="0.9" />

    <!-- Center Specular Energy Ray -->
    <path
      d="M 186 160 L 334 358"
      stroke="#FFFFFF"
      stroke-width="2.5"
      stroke-linecap="round"
      opacity="0.55"
    />
  </g>
</svg>